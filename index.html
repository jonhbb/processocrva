<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRVA 0371 - Login</title>
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/aparencia.js"></script>
    <style>
        body {
            background-color: var(--bs-tertiary-bg);
            padding-bottom: 52px;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #198754;
            color: white;
            text-align: center;
            border-radius: 10px 10px 0 0 !important;
            padding: 20px;
        }
        .card-body {
            padding: 30px;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .titulo-sistema {
            text-align: center;
            margin-bottom: 30px;
            color: #198754;
            font-weight: bold;
        }
        .site-footer-login {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            text-align: center;
            background: var(--bs-tertiary-bg);
            border-top: 1px solid var(--bs-border-color);
            font-size: 0.875rem;
            color: #6c757d;
        }
        #btnToggleSenha {
            border-color: #ced4da;
        }
        #btnToggleSenha:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando...</div>
    </div>

    <div class="container">
        <h1 class="titulo-sistema">Sistema de Processos Pendentes</h1>
        <div class="login-container">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">CRVA 0371 - Tramandaí/RS</h4>
                </div>
                <div class="card-body">
                    <div id="loginAviso" class="alert d-none" role="alert"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="usuario" required autocomplete="username" autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
                                <button type="button" class="btn btn-outline-secondary" id="btnToggleSenha" aria-label="Mostrar senha" title="Mostrar senha">
                                    <i class="fas fa-eye" id="iconeToggleSenha" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="manterConectado">
                            <label class="form-check-label" for="manterConectado">Manter-me conectado neste computador</label>
                            <div class="form-text">Use só em computador de uso pessoal. A sessão dura 12 horas.</div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="fas fa-sign-in-alt"></i> Entrar
                        </button>
                        <div class="text-center mt-3">
                            <a href="#" id="linkEsqueciSenha" class="small">Esqueci minha senha</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer-login">
        <small>&copy; Desenvolvido por Jonatan Barros</small>
    </footer>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { verificarLogin } from './js/auth.js';
        import { salvarSessao, obterUsuarioLogado } from './js/sessao.js';
        import { testarConexao, verificarTabela } from './js/supabase.js';

        // Aviso dentro da própria tela de login
        function mostrarAviso(mensagem, tipo = 'danger') {
            const aviso = document.getElementById('loginAviso');
            aviso.className = `alert alert-${tipo}`;
            aviso.textContent = mensagem;
        }

        function esconderAviso() {
            document.getElementById('loginAviso').className = 'alert d-none';
        }

        // Link de processo (QR da etiqueta) aberto sem login: volta para ele depois de entrar
        function destinoPosLogin() {
            try {
                const destino = sessionStorage.getItem('destinoPosLogin') || '';
                sessionStorage.removeItem('destinoPosLogin');
                return /^#processo=\d+$/.test(destino) ? destino : '';
            } catch (e) {
                return '';
            }
        }

        // Já conectado neste computador: vai direto ao sistema
        if (obterUsuarioLogado()) {
            window.location.replace('dashboard.html' + destinoPosLogin());
        }

        if (new URLSearchParams(location.search).get('motivo') === 'expirada') {
            mostrarAviso('Sua sessão expirou por inatividade. Entre novamente para continuar.', 'warning');
        }

        // Testar conexão ao carregar a página
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const resultadoConexao = await testarConexao();
                if (!resultadoConexao.success) {
                    console.error('Erro na conexão com o banco:', resultadoConexao.error);
                    mostrarAviso('Sem conexão com o banco de dados. Verifique a internet e recarregue a página.');
                    return;
                }
                const tabelaExiste = await verificarTabela('credenciais');
                if (!tabelaExiste) {
                    mostrarAviso('Tabela de credenciais não encontrada no banco de dados.');
                }
            } catch (error) {
                console.error('Erro ao testar conexão:', error);
                mostrarAviso('Sem conexão com o banco de dados. Verifique a internet e recarregue a página.');
            }
        });

        document.getElementById('linkEsqueciSenha').addEventListener('click', (e) => {
            e.preventDefault();
            mostrarAviso('Para redefinir sua senha, procure o administrador do sistema. Depois de entrar, você pode trocá-la em "Alterar minha senha".', 'info');
        });

        function mostrarLoading(texto = 'Carregando...') {
            const overlay = document.getElementById('loadingOverlay');
            overlay.querySelector('.loading-text').textContent = texto;
            overlay.classList.add('active');
        }

        function esconderLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        document.getElementById('btnToggleSenha').addEventListener('click', () => {
            const input = document.getElementById('senha');
            const icon = document.getElementById('iconeToggleSenha');
            const btn = document.getElementById('btnToggleSenha');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
                btn.setAttribute('aria-label', 'Ocultar senha');
                btn.setAttribute('title', 'Ocultar senha');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
                btn.setAttribute('aria-label', 'Mostrar senha');
                btn.setAttribute('title', 'Mostrar senha');
            }
        });

        // Event listener para o formulário de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            esconderAviso();

            const campoUsuario = document.getElementById('usuario');
            const campoSenha = document.getElementById('senha');
            const usuario = campoUsuario.value.trim();
            const senha = campoSenha.value;

            mostrarLoading('Verificando credenciais...');

            try {
                const usuarioEncontrado = await verificarLogin(usuario, senha);

                if (usuarioEncontrado) {
                    salvarSessao(usuarioEncontrado, document.getElementById('manterConectado').checked);
                    window.location.href = 'dashboard.html' + destinoPosLogin();
                    return;
                }

                esconderLoading();
                mostrarAviso('Usuário ou senha inválidos.');
                campoSenha.value = '';
                campoSenha.focus();
            } catch (error) {
                esconderLoading();
                mostrarAviso('Não foi possível entrar: sem conexão com o servidor. Tente novamente.');
            }
        });
    </script>
</body>
</html>
